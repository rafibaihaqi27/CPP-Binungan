<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPP Binungan</title>
<meta name="description" content="Dashboard shiftly CPP & Hauling Binungan, BMO 1">
<meta name="theme-color" content="#101310">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CPP Binungan">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html, body { margin: 0; height: 100%; background: #101310; overflow: hidden; }
  body { padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: block; width: 100%; height: 100%; border: 0; background: #f1f4ef; }
  #splash, #offline { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: #101310; color: #f3f6f1; text-align: center; padding: 24px; }
  #splash img, #offline img { width: 84px; height: 84px; border-radius: 18px; }
  #splash p, #offline p { margin: 0; color: #9aa494; font-size: 14px; }
  #splash b, #offline b { font-size: 18px; letter-spacing: .02em; }
  .bar { width: 120px; height: 3px; border-radius: 2px; background: #2b312a; overflow: hidden; }
  .bar span { display: block; width: 40%; height: 100%; background: #6cb33f; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; } }
  #offline button { margin-top: 6px; border: 0; border-radius: 8px; background: #6cb33f; color: #0c100b; font: 600 15px system-ui, sans-serif; padding: 10px 18px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<iframe id="app" title="Dashboard CPP Binungan" allow="clipboard-write"></iframe>
<div id="splash"><img src="icons/icon-192.png" alt=""><b>CPP Binungan</b><div class="bar"><span></span></div><p>Memuat dashboard shiftly…</p></div>
<div id="offline" hidden><img src="icons/icon-192.png" alt=""><b>Tidak ada koneksi internet</b><p>Dashboard butuh internet untuk mengambil data terbaru dari Google Sheets.</p><button id="retry" type="button">Coba lagi</button></div>
<script>
  // Link web app Apps Script (Deploy › Manage deployments). Ganti di sini bila URL berubah.
  var DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbxArDsqvRSfGKqjiSBTaexKpxbhAbGbdQM2GqCcvV7Y9tQEfY9GvzaMavh6Oox_TC1F/exec';
  // Reload the data when the app comes back to the screen after this long in the background.
  var REFRESH_AFTER_MS = 10 * 60 * 1000;

  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');
  var offline = document.getElementById('offline');
  var hiddenAt = 0;

  function load() {
    if (!navigator.onLine) { offline.hidden = false; return; }
    offline.hidden = true;
    splash.hidden = false;
    frame.src = DASHBOARD_URL + (DASHBOARD_URL.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now();
  }
  frame.addEventListener('load', function () { if (frame.src) splash.hidden = true; });
  document.getElementById('retry').addEventListener('click', load);
  window.addEventListener('online', function () { if (!offline.hidden) load(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > REFRESH_AFTER_MS) load();
  });
  load();

  // Register right away: the window "load" event waits for the dashboard iframe.
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
